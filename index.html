<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24/7 Live Website Observer & Monitor</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; }
        .font-mono { font-family: 'Fira Code', monospace; }
        
        /* Pulse Animation for Status */
        .pulse-green { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); animation: pulseGreen 2s infinite; }
        .pulse-red { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); animation: pulseRed 2s infinite; }
        
        @keyframes pulseGreen {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        @keyframes pulseRed {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<text class="bg-[#0b0f19] text-gray-100 min-h-screen p-4 sm:p-8">
    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center bg-[#131b2e] p-6 rounded-2xl border border-gray-800 shadow-2xl gap-4">
            <div class="flex items-center space-x-4">
                <div class="p-3 bg-indigo-600/20 text-indigo-400 rounded-xl border border-indigo-500/30">
                    <i class="fa-solid fa-radar text-3xl animate-spin" style="animation-duration: 8s;"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-white tracking-wide">Uptime Pulse Pro</h1>
                    <p class="text-sm text-gray-400">24/7 Realtime Website Observer & Latency Monitor</p>
                </div>
            </div>
            <div class="flex items-center space-x-3 bg-[#0b0f19] px-4 py-2 rounded-xl border border-gray-800">
                <span id="globalIndicator" class="w-3 h-3 rounded-full bg-gray-500"></span>
                <span id="globalStatusText" class="text-sm font-semibold text-gray-400">System Idle</span>
            </div>
        </header>

        <!-- URL Input Card -->
        <div class="bg-[#131b2e] p-6 rounded-2xl border border-gray-800 shadow-xl">
            <label class="block text-sm font-semibold text-gray-300 mb-2">
                <i class="fa-solid fa-link text-indigo-400 mr-2"></i>মনিটর করার জন্য ওয়েবসাইটের লিংক দিন:
            </label>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="url" id="targetUrlInput" placeholder="https://example.com" required
                    class="flex-1 bg-[#0b0f19] border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                <button onclick="startMonitoring()" 
                    class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-6 py-3 rounded-xl transition flex items-center justify-center space-x-2 shadow-lg shadow-indigo-600/30">
                    <i class="fa-solid fa-play"></i>
                    <span>Start 24/7 Observe</span>
                </button>
                <button onclick="stopMonitoring()" 
                    class="bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/30 font-semibold px-5 py-3 rounded-xl transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-stop"></i>
                    <span>Stop</span>
                </button>
            </div>
        </div>

        <!-- Metric Cards Grid -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            
            <!-- Status Card -->
            <div class="bg-[#131b2e] p-5 rounded-2xl border border-gray-800 flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-400 font-semibold tracking-wider uppercase">Live Status</p>
                    <h3 id="cardStatus" class="text-lg font-bold text-gray-300 mt-1">Standby</h3>
                </div>
                <div id="statusPulseBg" class="w-10 h-10 rounded-full bg-gray-800 flex items-center justify-center">
                    <i id="statusIcon" class="fa-solid fa-signal text-gray-500"></i>
                </div>
            </div>

            <!-- Response Time -->
            <div class="bg-[#131b2e] p-5 rounded-2xl border border-gray-800 flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-400 font-semibold tracking-wider uppercase">Response Time</p>
                    <h3 id="cardLatency" class="text-2xl font-bold text-indigo-400 mt-1">0 ms</h3>
                </div>
                <div class="w-10 h-10 rounded-full bg-indigo-500/10 text-indigo-400 flex items-center justify-center border border-indigo-500/20">
                    <i class="fa-solid fa-bolt"></i>
                </div>
            </div>

            <!-- Checks Count -->
            <div class="bg-[#131b2e] p-5 rounded-2xl border border-gray-800 flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-400 font-semibold tracking-wider uppercase">Total Pings</p>
                    <h3 id="cardTotalPings" class="text-2xl font-bold text-emerald-400 mt-1">0</h3>
                </div>
                <div class="w-10 h-10 rounded-full bg-emerald-500/10 text-emerald-400 flex items-center justify-center border border-emerald-500/20">
                    <i class="fa-solid fa-arrows-rotate"></i>
                </div>
            </div>

            <!-- Last Checked -->
            <div class="bg-[#131b2e] p-5 rounded-2xl border border-gray-800 flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-400 font-semibold tracking-wider uppercase">Last Check Time</p>
                    <h3 id="cardLastTime" class="text-base font-bold text-gray-300 mt-1">--:--:--</h3>
                </div>
                <div class="w-10 h-10 rounded-full bg-purple-500/10 text-purple-400 flex items-center justify-center border border-purple-500/20">
                    <i class="fa-regular fa-clock"></i>
                </div>
            </div>
        </div>

        <!-- Analytics Chart & Terminal Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <!-- Latency Graph -->
            <div class="bg-[#131b2e] p-6 rounded-2xl border border-gray-800 shadow-xl flex flex-col justify-between">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-gray-200 flex items-center">
                        <i class="fa-solid fa-chart-line text-indigo-400 mr-2"></i>Response Latency History
                    </h3>
                    <span class="text-xs text-gray-500 bg-[#0b0f19] px-2.5 py-1 rounded-lg border border-gray-800">Realtime</span>
                </div>
                <div class="h-64">
                    <canvas id="latencyChart"></canvas>
                </div>
            </div>

            <!-- Realtime Console Logs -->
            <div class="bg-[#131b2e] p-6 rounded-2xl border border-gray-800 shadow-xl flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-gray-200 flex items-center">
                        <i class="fa-solid fa-terminal text-emerald-400 mr-2"></i>Observation Terminal Logs
                    </h3>
                    <span class="text-xs text-emerald-400 bg-emerald-950/50 px-2.5 py-1 rounded-lg border border-emerald-800/50 flex items-center">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping mr-2"></span> Live Stream
                    </span>
                </div>
                <div id="terminalLog" class="flex-1 bg-[#070a12] p-4 rounded-xl border border-gray-800/80 font-mono text-xs overflow-y-auto max-h-64 space-y-2 text-gray-300">
                    <div class="text-gray-500">// System ready. Enter a URL above to start observing...</div>
                </div>
            </div>
        </div>

    </div>

    <!-- Frontend Script Logic -->
    <script>
        let latencyChart = null;
        let chartData = { labels: [], datasets: [{
            label: 'Latency (ms)',
            data: [],
            borderColor: '#6366f1',
            backgroundColor: 'rgba(99, 102, 241, 0.1)',
            fill: true,
            tension: 0.4,
            borderWidth: 2
        }]};

        // Chart.js Setup
        function initChart() {
            const ctx = document.getElementById('latencyChart').getContext('2d');
            latencyChart = new Chart(ctx, {
                type: 'line',
                data: chartData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { grid: { color: '#1e293b' }, ticks: { color: '#64748b', font: { size: 10 } } },
                        y: { grid: { color: '#1e293b' }, ticks: { color: '#64748b', font: { size: 10 } }, beginAtZero: true }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        async function startMonitoring() {
            const url = document.getElementById('targetUrlInput').value.trim();
            if(!url) return alert('অনুগ্রহ করে একটি সঠিক URL দিন!');

            try {
                const res = await fetch('/api/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                const data = await res.json();
                alert(data.message);
            } catch (err) {
                alert('শুরু করতে সমস্যা হয়েছে: ' + err.message);
            }
        }

        async function stopMonitoring() {
            try {
                const res = await fetch('/api/stop', { method: 'POST' });
                const data = await res.json();
                alert(data.message);
            } catch (err) {
                alert('বন্ধ করতে সমস্যা হয়েছে!');
            }
        }

        async function syncDashboard() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();

                // URL Setting
                if(data.url && !document.getElementById('targetUrlInput').value) {
                    document.getElementById('targetUrlInput').value = data.url;
                }

                // Global Indicator Updates
                const globalInd = document.getElementById('globalIndicator');
                const globalTxt = document.getElementById('globalStatusText');
                const cardStat = document.getElementById('cardStatus');
                const statusPulse = document.getElementById('statusPulseBg');
                const statusIcon = document.getElementById('statusIcon');

                if (data.status === 'ONLINE 🟢') {
                    globalInd.className = "w-3 h-3 rounded-full bg-emerald-500 pulse-green";
                    globalTxt.innerText = "Monitoring Active";
                    globalTxt.className = "text-sm font-semibold text-emerald-400";
                    cardStat.innerText = "ONLINE 200 OK";
                    cardStat.className = "text-lg font-bold text-emerald-400 mt-1";
                    statusPulse.className = "w-10 h-10 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center pulse-green";
                    statusIcon.className = "fa-solid fa-check text-emerald-400";
                } else if (data.status.includes('ISSUES') || data.status.includes('DOWN')) {
                    globalInd.className = "w-3 h-3 rounded-full bg-red-500 pulse-red";
                    globalTxt.innerText = "Target Down / Issue";
                    globalTxt.className = "text-sm font-semibold text-red-400";
                    cardStat.innerText = data.status;
                    cardStat.className = "text-lg font-bold text-red-400 mt-1";
                    statusPulse.className = "w-10 h-10 rounded-full bg-red-500/20 text-red-400 flex items-center justify-center pulse-red";
                    statusIcon.className = "fa-solid fa-triangle-exclamation text-red-400";
                } else {
                    globalInd.className = "w-3 h-3 rounded-full bg-gray-500";
                    globalTxt.innerText = "System Idle";
                    globalTxt.className = "text-sm font-semibold text-gray-400";
                    cardStat.innerText = data.status || "Standby";
                    cardStat.className = "text-lg font-bold text-gray-400 mt-1";
                    statusPulse.className = "w-10 h-10 rounded-full bg-gray-800 text-gray-500 flex items-center justify-center";
                    statusIcon.className = "fa-solid fa-signal text-gray-500";
                }

                // Metrics Update
                document.getElementById('cardLatency').innerText = (data.lastLatency || 0) + ' ms';
                document.getElementById('cardTotalPings').innerText = data.totalPings || 0;
                document.getElementById('cardLastTime').innerText = data.lastChecked || '--:--:--';

                // Terminal Logs Update
                if(data.logs && data.logs.length > 0) {
                    const terminal = document.getElementById('terminalLog');
                    terminal.innerHTML = data.logs.map(log => {
                        let colorClass = "text-emerald-400";
                        if(log.includes("Error") || log.includes("DOWN") || log.includes("404") || log.includes("500")) colorClass = "text-red-400";
                        if(log.includes("Setting up") || log.includes("Stopped")) colorClass = "text-yellow-400";
                        return `<div class="${colorClass}">${log}</div>`;
                    }).join('');
                }

                // Chart Data Sync
                if(data.history && data.history.length > 0) {
                    latencyChart.data.labels = data.history.map(h => h.time);
                    latencyChart.data.datasets[0].data = data.history.map(h => h.latency);
                    latencyChart.update();
                }

            } catch (err) {
                console.error("Dashboard Sync Error:", err);
            }
        }

        // Initialize Page
        window.onload = () => {
            initChart();
            syncDashboard();
            setInterval(syncDashboard, 2000); // ২ সেকেন্ড পর পর ড্যাশবোর্ড ডাটা আপডেট হবে
        };
    </script>
</body>
</html>
